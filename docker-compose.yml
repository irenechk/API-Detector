services:
  db:
    image: timescale/timescaledb:latest-pg15
    environment:
      POSTGRES_DB: zaddp
      POSTGRES_USER: zaddp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zaddp_secret_2024}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  backend:
    build: ./backend
    platform: linux/arm64
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    restart: on-failure
    environment:
      DATABASE_URL: postgresql+asyncpg://zaddp:${POSTGRES_PASSWORD:-zaddp_secret_2024}@db:5432/zaddp
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-hackathon-demo-secret-key-2024}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-hackathon-demo-nextauth-secret}
      ML_ADMIN_EMAILS: ${ML_ADMIN_EMAILS:-admin@zaddp.io}
      SCANNER_API_TOKEN: ${SCANNER_API_TOKEN:-}
      ENVIRONMENT: production

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_WS_URL: http://localhost:8000
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-hackathon-demo-nextauth-secret}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      ML_ADMIN_EMAILS: ${ML_ADMIN_EMAILS:-admin@zaddp.io}
      AZURE_AD_CLIENT_ID: ${AZURE_AD_CLIENT_ID:-}
      AZURE_AD_CLIENT_SECRET: ${AZURE_AD_CLIENT_SECRET:-}
      AZURE_AD_TENANT_ID: ${AZURE_AD_TENANT_ID:-}

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - frontend
      - backend

volumes:
  pgdata:
  redisdata:
