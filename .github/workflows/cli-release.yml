name: CLI Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
      - name: Add target
        run: rustup target add ${{ matrix.target }}
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package
        run: |
          mkdir -p ../dist
          BIN="target/${{ matrix.target }}/release/zaddp"
          if [[ "${{ matrix.target }}" == *"linux"* ]]; then
            tar -czf "../dist/zaddp-${{ matrix.target }}.tar.gz" -C "$(dirname $BIN)" zaddp
          else
            tar -czf "../dist/zaddp-${{ matrix.target }}.tar.gz" -C "$(dirname $BIN)" zaddp
          fi
          shasum -a 256 "../dist/zaddp-${{ matrix.target }}.tar.gz" >> "../dist/SHA256SUMS" 2>/dev/null || sha256sum "../dist/zaddp-${{ matrix.target }}.tar.gz" >> "../dist/SHA256SUMS"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: zaddp-${{ matrix.target }}
          path: dist/*

  deb:
    runs-on: ubuntu-latest
    needs: build
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-deb
        run: cargo install cargo-deb --locked || cargo install cargo-deb
      - name: Build .deb
        run: cargo deb --target x86_64-unknown-linux-musl --no-build
      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: zaddp-deb
          path: cli/target/x86_64-unknown-linux-musl/debian/*.deb

  release:
    runs-on: ubuntu-latest
    needs: [build, deb]
    steps:
      - uses: actions/checkout@v4
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/zaddp-*.tar.gz
            artifacts/**/SHA256SUMS
            artifacts/**/zaddp_*.deb
          draft: false
          prerelease: false
